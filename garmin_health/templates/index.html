<!doctype html>
<html lang="{{ lang }}" dir="{{ 'rtl' if lang == 'he' else 'ltr' }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0b0d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Health">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="{{ url_for('static', filename='icon-180.png') }}">
<title>Garmin Health</title>
<script src="{{ url_for('static', filename='chart.umd.min.js') }}"></script>
<style>
  :root {
    --bg: #0a0b0d; --card: #15171b; --card2: #1c1f25; --line: #24272e;
    --text: #f2f3f5; --muted: #8b919c; --faint: #5c626d;
    --good: #2bd97c; --fair: #ffd25a; --low: #ff5a5f;
    --sleep: #9d8cff; --bb: #3fd0f5; --ready: #ff9f43;
    --deep: #5b4bdb; --light: #9d8cff; --rem: #3fd0f5; --awake: #4a4f5a;
    --safe-t: env(safe-area-inset-top); --safe-b: env(safe-area-inset-bottom);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { background: var(--bg); }
  body {
    margin: 0; background: var(--bg); color: var(--text); min-height: 100vh;
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Arial, sans-serif;
    -webkit-font-smoothing: antialiased; overscroll-behavior-y: none;
  }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  .num { font-variant-numeric: tabular-nums; direction: ltr; unicode-bidi: isolate; display: inline-block; }

  /* top bar */
  .bar {
    position: sticky; top: 0; z-index: 5; display: grid; grid-template-columns: 44px 1fr 44px; align-items: center;
    padding: calc(var(--safe-t) + 8px) 12px 8px; background: rgba(10, 11, 13, .82);
    -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px);
  }
  .bar .mid { text-align: center; line-height: 1.2; }
  .bar .mid b { font-size: 16px; font-weight: 650; display: block; }
  .bar .mid small { font-size: 12px; color: var(--muted); }
  .bar .mid small.stale { color: var(--fair); }
  .iconbtn { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 50%; }
  .iconbtn:active { background: var(--card2); }
  .iconbtn svg { width: 22px; height: 22px; stroke: var(--text); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .spin svg { animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  main { max-width: 560px; margin: 0 auto; padding: 4px 16px calc(var(--safe-b) + 28px); }
  .view { display: none; } .view.on { display: block; animation: fade .25s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } }

  /* hero */
  .hero { text-align: center; padding: 10px 0 18px; }
  .ringwrap { position: relative; width: 220px; height: 220px; margin: 0 auto; }
  .ringwrap svg { width: 100%; height: 100%; transform: rotate(-90deg); overflow: visible; }
  .ringwrap .in { position: absolute; inset: 0; display: grid; place-content: center; }
  .ringwrap .in b { font-size: 64px; font-weight: 700; letter-spacing: -2px; line-height: 1; }
  .ringwrap .in b sup { font-size: 22px; font-weight: 600; letter-spacing: 0; margin-inline-start: 2px; color: var(--muted); }
  .ringwrap .in span { font-size: 12px; color: var(--muted); letter-spacing: .12em; text-transform: uppercase; margin-top: 6px; }
  .track { stroke: var(--line); fill: none; }
  .arc { fill: none; stroke-linecap: round; stroke-dasharray: 100; stroke-dashoffset: 100; transition: stroke-dashoffset 1.1s cubic-bezier(.2, .8, .2, 1); }
  .headline { font-size: 24px; font-weight: 700; margin: 16px 0 4px; letter-spacing: -.3px; }
  .sub { color: var(--muted); margin: 0; font-size: 15px; }
  .chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 14px; }
  .chip { font-size: 13px; padding: 6px 11px; border-radius: 999px; background: var(--card2); color: var(--muted); }
  .chip.pos { color: var(--good); background: rgba(43, 217, 124, .1); }
  .chip.neg { color: var(--fair); background: rgba(255, 210, 90, .1); }
  .basis { color: var(--faint); font-size: 12px; margin-top: 10px; }

  /* three small rings */
  .minis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 12px; }
  .mini { background: var(--card); border-radius: 20px; padding: 14px 8px 12px; text-align: center; }
  .mini .ringwrap { width: 74px; height: 74px; }
  .mini .ringwrap .in b { font-size: 22px; letter-spacing: -.5px; }
  .mini small { display: block; color: var(--muted); font-size: 12px; margin-top: 8px; }
  .mini i { display: block; font-style: normal; font-size: 12px; color: var(--faint); margin-top: 1px; }

  .card { background: var(--card); border-radius: 22px; padding: 16px; margin-bottom: 12px; }
  .card h3 { margin: 0 0 12px; font-size: 13px; font-weight: 600; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; display: flex; justify-content: space-between; align-items: baseline; }
  .card h3 a { color: var(--muted); text-decoration: none; text-transform: none; letter-spacing: 0; font-weight: 500; }

  /* sleep */
  .sleeptop { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
  .big { font-size: 34px; font-weight: 700; letter-spacing: -1px; }
  .badge { font-size: 13px; padding: 4px 10px; border-radius: 999px; background: rgba(157, 140, 255, .14); color: var(--sleep); }
  .times { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .stages { display: flex; height: 12px; border-radius: 6px; overflow: hidden; gap: 2px; margin: 14px 0 10px; }
  .stages div { transition: flex-grow .9s cubic-bezier(.2, .8, .2, 1); flex-grow: 0; }
  .legend { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; font-size: 12px; color: var(--muted); }
  .legend b { display: block; color: var(--text); font-size: 14px; font-weight: 600; }
  .legend span::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-inline-end: 5px; background: var(--c); }
  .week { display: flex; align-items: flex-end; gap: 6px; height: 54px; margin-top: 16px; direction: ltr; }
  .week div { flex: 1; text-align: center; font-size: 10px; color: var(--faint); }
  .week i { display: block; border-radius: 4px; background: var(--card2); margin-bottom: 4px; height: 0; transition: height .8s cubic-bezier(.2, .8, .2, 1); }
  .week div.today i { background: var(--sleep); }

  /* vitals */
  .vital { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 4px 12px; padding: 12px 0; border-top: 1px solid var(--line); }
  .vital:first-of-type { border-top: 0; padding-top: 0; }
  .vital .k { font-size: 15px; }
  .vital .k small { display: block; color: var(--muted); font-size: 12px; }
  .vital .v { font-size: 22px; font-weight: 650; text-align: end; }
  .vital .v small { font-size: 13px; color: var(--muted); font-weight: 500; }
  .meter { grid-column: 1 / -1; position: relative; height: 6px; border-radius: 3px; background: var(--card2); margin-top: 6px; direction: ltr; }
  .meter .band { position: absolute; top: 0; bottom: 0; border-radius: 3px; background: rgba(43, 217, 124, .28); }
  .meter .fill { position: absolute; top: 0; bottom: 0; left: 0; border-radius: 3px; width: 0; transition: width .9s cubic-bezier(.2, .8, .2, 1); }
  .meter .tick { position: absolute; top: -3px; bottom: -3px; width: 2px; margin-left: -1px; border-radius: 1px; background: var(--muted); }
  .meter .dot { position: absolute; top: 50%; width: 12px; height: 12px; margin: -6px 0 0 -6px; border-radius: 50%; border: 2px solid var(--card); }

  /* activities */
  .act { display: grid; grid-template-columns: 40px 1fr auto; gap: 12px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
  .act:first-child { border-top: 0; padding-top: 0; }
  .act .ic { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: var(--card2); }
  .act .ic svg { width: 20px; height: 20px; stroke: var(--bb); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .act b { font-weight: 600; font-size: 15px; display: block; }
  .act small { color: var(--muted); font-size: 12px; }
  .act .load { text-align: end; font-size: 18px; font-weight: 650; }
  .act .load small { display: block; font-weight: 400; }
  .empty { color: var(--muted); font-size: 14px; }

  /* trends */
  .seg { display: flex; background: var(--card); border-radius: 12px; padding: 3px; margin: 6px 0 12px; }
  .seg button { flex: 1; padding: 8px 0; border-radius: 9px; color: var(--muted); font-size: 14px; }
  .seg button.on { background: var(--card2); color: var(--text); font-weight: 600; }
  .chart { position: relative; height: 210px; }

  /* drawer */
  .scrim { position: fixed; inset: 0; background: rgba(0, 0, 0, .55); opacity: 0; pointer-events: none; transition: opacity .25s; z-index: 9; }
  .drawer {
    position: fixed; top: 0; bottom: 0; inset-inline-start: 0; width: min(300px, 82vw); z-index: 10;
    background: #111317; padding: calc(var(--safe-t) + 18px) 14px calc(var(--safe-b) + 18px);
    transform: translateX(-100%); transition: transform .3s cubic-bezier(.2, .8, .2, 1); display: flex; flex-direction: column;
  }
  [dir="rtl"] .drawer { transform: translateX(100%); }
  body.menu .drawer { transform: none; }
  body.menu .scrim { opacity: 1; pointer-events: auto; }
  .drawer .brand { display: flex; align-items: center; gap: 10px; padding: 0 8px 18px; font-weight: 700; font-size: 18px; }
  .drawer .brand img { width: 30px; height: 30px; border-radius: 8px; }
  .nav { display: flex; align-items: center; gap: 14px; width: 100%; padding: 13px 10px; border-radius: 12px; font-size: 16px; text-align: start; color: var(--text); text-decoration: none; }
  .nav svg { width: 20px; height: 20px; stroke: var(--muted); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .nav.on { background: var(--card2); } .nav.on svg { stroke: var(--good); }
  .nav:active { background: var(--card2); }
  .drawer .foot { margin-top: auto; color: var(--faint); font-size: 12px; padding: 0 10px; line-height: 1.6; }

  .toast {
    position: fixed; left: 50%; bottom: calc(var(--safe-b) + 18px); transform: translate(-50%, 30px); opacity: 0;
    background: var(--card2); color: var(--text); padding: 10px 16px; border-radius: 14px; font-size: 14px;
    transition: .3s; z-index: 20; max-width: calc(100vw - 32px); text-align: center; pointer-events: none;
  }
  .toast.on { opacity: 1; transform: translate(-50%, 0); }
  .alert { background: rgba(255, 210, 90, .1); color: var(--fair); border-radius: 14px; padding: 10px 14px; font-size: 14px; margin: 4px 0 8px; display: none; }
  .alert.err { background: rgba(255, 90, 95, .1); color: var(--low); }
  .alert.on { display: block; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>

<header class="bar">
  <button class="iconbtn" id="menubtn" aria-label="menu">
    <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
  </button>
  <div class="mid"><b id="title"></b><small id="fresh"></small></div>
  <button class="iconbtn" id="syncbtn" aria-label="sync">
    <svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 0 0-14.3-4.9L4 8M4 4v4h4M4 13a8 8 0 0 0 14.3 4.9L20 16M20 20v-4h-4"/></svg>
  </button>
</header>

<main>
  <div id="alert" class="alert"></div>

  <section id="v-today" class="view on">
    <div class="hero">
      <div class="ringwrap" id="hero-ring"></div>
      <h1 class="headline" id="headline">&nbsp;</h1>
      <p class="sub" id="subline"></p>
      <div class="chips" id="chips"></div>
      <div class="basis" id="basis"></div>
    </div>

    <div class="minis">
      <div class="mini"><div class="ringwrap" id="m-sleep"></div><small data-t="sleep"></small><i id="m-sleep-i"></i></div>
      <div class="mini"><div class="ringwrap" id="m-bb"></div><small>Body Battery</small><i id="m-bb-i"></i></div>
      <div class="mini"><div class="ringwrap" id="m-ready"></div><small data-t="readiness"></small><i id="m-ready-i"></i></div>
    </div>

    <div class="card">
      <h3><span data-t="sleep"></span><a href="#trends" data-t="trendsLink"></a></h3>
      <div class="sleeptop"><span class="big num" id="s-total">–</span><span class="badge" id="s-score"></span></div>
      <div class="times" id="s-times"></div>
      <div class="stages" id="s-stages">
        <div style="background:var(--deep)"></div><div style="background:var(--light)"></div>
        <div style="background:var(--rem)"></div><div style="background:var(--awake)"></div>
      </div>
      <div class="legend" id="s-legend"></div>
      <div class="week" id="s-week"></div>
    </div>

    <div class="card" id="vitals"><h3 data-t="body"></h3></div>

    <div class="card" id="fitness"></div>

    <div class="card">
      <h3><span data-t="acts"></span><a href="#activities" data-t="all"></a></h3>
      <div id="acts-preview"></div>
    </div>
  </section>

  <section id="v-trends" class="view">
    <div class="seg" id="range">
      <button data-days="7">7</button><button data-days="30">30</button><button data-days="90">90</button>
    </div>
    <div class="card"><h3 data-t="sleep"></h3><div class="chart"><canvas id="c-sleep"></canvas></div></div>
    <div class="card"><h3>HRV</h3><div class="chart"><canvas id="c-hrv"></canvas></div></div>
    <div class="card"><h3 data-t="rhr"></h3><div class="chart"><canvas id="c-rhr"></canvas></div></div>
    <div class="card"><h3>Body Battery</h3><div class="chart"><canvas id="c-bb"></canvas></div></div>
    <div class="card"><h3 data-t="load"></h3><div class="chart"><canvas id="c-load"></canvas></div></div>
    <div class="card"><h3 data-t="stressSteps"></h3><div class="chart"><canvas id="c-stress"></canvas></div></div>
    <div class="card"><h3 data-t="spo2Title"></h3><div class="chart"><canvas id="c-spo2"></canvas></div></div>
  </section>

  <section id="v-activities" class="view">
    <div class="card" id="acts-all"></div>
  </section>
</main>

<div class="scrim" id="scrim"></div>
<nav class="drawer" id="drawer">
  <div class="brand"><img src="{{ url_for('static', filename='icon-180.png') }}" alt="">Garmin Health</div>
  <a class="nav" href="#today" data-view="today"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 8 8"/></svg><span data-t="today"></span></a>
  <a class="nav" href="#trends" data-view="trends"><svg viewBox="0 0 24 24"><path d="M4 19V5M4 19h16M8 15l3-4 3 2 5-6"/></svg><span data-t="trends"></span></a>
  <a class="nav" href="#activities" data-view="activities"><svg viewBox="0 0 24 24"><path d="M3 12h4l3-7 4 14 3-7h4"/></svg><span data-t="acts"></span></a>
  <button class="nav" id="navsync"><svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 0 0-14.3-4.9L4 8M4 4v4h4M4 13a8 8 0 0 0 14.3 4.9L20 16M20 20v-4h-4"/></svg><span data-t="syncNow"></span></button>
  <a class="nav" href="?lang={{ 'he' if lang == 'en' else 'en' }}"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg><span>{{ 'עברית' if lang == 'en' else 'English' }}</span></a>
  <div class="foot" id="foot"></div>
</nav>
<div class="toast" id="toast"></div>

<script>
const LANG = "{{ lang }}";
const T = {
  en: {
    today: "Today", trends: "Trends", acts: "Activities", all: "All", trendsLink: "Trends",
    sleep: "Sleep", readiness: "Readiness", body: "Body", rhr: "Resting heart rate", load: "Training load",
    stressSteps: "Stress and steps", recovery: "Recovery",
    good: ["Well recovered", "Your body is ready for a demanding day."],
    fair: ["Moderately recovered", "A moderate day suits you best."],
    low: ["Your body is tired", "Consider going easy today."],
    unknown: ["No data yet", "Sync the watch to see today's recovery."],
    basis: d => `Based on the night of ${d}`,
    hrvLow: "HRV below your range", hrvHigh: "HRV above your range", hrvOk: "HRV in your range",
    shortSleep: "Short sleep", greatSleep: "Great sleep", rhrHigh: "Resting HR is up", rhrLow: "Resting HR is low",
    bbLow: "Low Body Battery", bbHigh: "Full battery", rampUp: "Load rising fast",
    deep: "Deep", light: "Light", rem: "REM", awake: "Awake", score: "score",
    hrvSub: (lo, hi) => `Last night · your range ${lo}–${hi}`,
    rhrSub: a => a == null ? "This morning" : `30-day average ${a}`,
    stress: "Stress", stressSub: "Yesterday's average", steps: "Steps", stepsSub: g => `Yesterday · goal ${g}`,
    stressLv: s => s <= 25 ? "rest" : s <= 50 ? "low" : s <= 75 ? "medium" : "high",
    noActs: "No activities in the last 7 days.", loadU: "load",
    syncNow: "Sync now", syncTip: "Pulls whatever the watch already uploaded to Garmin",
    syncDone: "Updated", syncFailed: s => `Sync ended: ${s}`, syncRunning: "A sync is already running",
    syncRecent: m => `Synced recently. Try again in ${m} min`, syncBlocked: "Sync paused to protect the account",
    watchAgo: h => h < 1 ? "Watch synced just now" : `Watch synced ${h} h ago`,
    stale: h => `The watch hasn't uploaded in ${h} hours. Sync it (Wi-Fi or the phone app) to get fresh data.`,
    noSync: "No watch sync recorded yet.",
    lastRun: s => `Last run: ${s.replace(/_/g, " ")}`,
    hours: "hours", lastNight: "Last night", weekly: "7-day avg", baseline: "Range",
    high: "High", lowL: "Low", atWake: "At wake", daily: "Activity", acute: "Acute", chronic: "Chronic",
    days: ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"],
    fitTitle: "Fitness and oxygen", spo2Title: "Blood oxygen (overnight)",
    fitAge: "Fitness age", fitSub: (a, d) => `Actual age ${a}` + (d >= 0.5 ? ` · ${d.toFixed(1)} years younger` : d <= -0.5 ? ` · ${(-d).toFixed(1)} years older` : ""),
    fitScale: (lo, a) => `Best reachable ${lo} · actual ${a}`,
    spo2: "Blood oxygen", spo2Sub: lo => `Overnight average · lowest ${lo}%`,
    vo2: "VO2 max", vo2Garmin: "From Garmin", vo2Est: "Estimate from resting HR and age. Garmin has no value yet (needs a GPS run or ride)",
    avg: "Average", lowest: "Lowest",
    types: {},
    levels: {},
  },
  he: {
    today: "היום", trends: "מגמות", acts: "פעילויות", all: "הכל", trendsLink: "מגמות",
    sleep: "שינה", readiness: "מוכנות", body: "הגוף", rhr: "דופק במנוחה", load: "עומס אימונים",
    stressSteps: "סטרס וצעדים", recovery: "התאוששות",
    good: ["התאוששת היטב", "הגוף מוכן ליום תובעני."],
    fair: ["התאוששות בינונית", "יום מתון יתאים לך היום."],
    low: ["הגוף עייף", "כדאי להוריד עומס היום."],
    unknown: ["אין עדיין נתונים", "סנכרן את השעון כדי לראות את ההתאוששות."],
    basis: d => `מבוסס על הלילה של ${d}`,
    hrvLow: "HRV מתחת לטווח שלך", hrvHigh: "HRV מעל הטווח שלך", hrvOk: "HRV בטווח שלך",
    shortSleep: "שינה קצרה", greatSleep: "שינה מצוינת", rhrHigh: "דופק מנוחה גבוה מהרגיל", rhrLow: "דופק מנוחה נמוך",
    bbLow: "Body Battery נמוך", bbHigh: "סוללה מלאה", rampUp: "עומס האימונים עולה מהר",
    deep: "עמוקה", light: "קלה", rem: "REM", awake: "ער", score: "ציון",
    hrvSub: (lo, hi) => `לילה אחרון · הטווח שלך ${lo}–${hi}`,
    rhrSub: a => a == null ? "הבוקר" : `ממוצע 30 יום ${a}`,
    stress: "סטרס", stressSub: "ממוצע אתמול", steps: "צעדים", stepsSub: g => `אתמול · יעד ${g}`,
    stressLv: s => s <= 25 ? "מנוחה" : s <= 50 ? "נמוך" : s <= 75 ? "בינוני" : "גבוה",
    noActs: "אין פעילויות ב-7 הימים האחרונים.", loadU: "עומס",
    syncNow: "סנכרן עכשיו", syncTip: "מושך מ-Garmin את מה שהשעון כבר העלה",
    syncDone: "עודכן", syncFailed: s => `הסנכרון הסתיים: ${s}`, syncRunning: "סנכרון כבר רץ",
    syncRecent: m => `סונכרן לא מזמן. נסה שוב בעוד ${m} דק׳`, syncBlocked: "הסנכרון מושהה כדי להגן על החשבון",

const $ = id => document.getElementById(id);
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const hm = s => s == null ? "–" : `${Math.floor(s / 3600)}:${String(Math.floor(s % 3600 / 60)).padStart(2, "0")}`;
const clock = iso => iso ? iso.slice(11, 16) : "";
const dm = iso => `${+iso.slice(8, 10)}.${+iso.slice(5, 7)}`;
const n0 = x => x == null ? "–" : Math.round(x).toLocaleString();
const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
const raf2 = fn => requestAnimationFrame(() => requestAnimationFrame(fn));

function ring(el, pct, color, width, label, suffix = "") {
  const r = 50 - width / 2;
  el.innerHTML = `<svg viewBox="0 0 100 100">
      <circle class="track" cx="50" cy="50" r="${r}" stroke-width="${width}"/>
      <circle class="arc" cx="50" cy="50" r="${r}" stroke-width="${width}" pathLength="100" stroke="${color}"
        style="filter: drop-shadow(0 0 ${width / 2}px ${color}66)"/></svg>
    <div class="in"><b class="num">–</b>${label ? `<span>${label}</span>` : ""}</div>`;
  const val = pct == null ? null : Math.max(0, Math.min(100, pct));
  raf2(() => { el.querySelector(".arc").style.strokeDashoffset = 100 - (val ?? 0); });
  countUp(el.querySelector("b"), val, suffix);
}
function countUp(el, target, suffix = "") {
  if (target == null) { el.textContent = "–"; return; }
  if (still) { el.innerHTML = Math.round(target) + suffix; return; }
  const t0 = performance.now(), dur = 900;
  const step = t => {
    const p = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - p, 3);
    el.innerHTML = Math.round(target * e) + suffix;
    if (p < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

let lastLoad = 0;
async function loadToday() {
  lastLoad = Date.now();
  const s = await (await fetch("/api/summary")).json();
  const t = s.today || {}, r = s.recovery, f = s.freshness, b = s.baseline_30d, y = s.yesterday_activity;

  if (viewName() === "today") $("title").textContent = todayTitle();
  const h = f.hours_since_sync == null ? null : Math.round(f.hours_since_sync);
  $("fresh").textContent = h == null ? T.noSync : T.watchAgo(h);
  $("fresh").className = f.stale ? "stale" : "";

  const alert = $("alert");
  const lr = f.last_run && f.last_run.status;
  if (["login_needed", "error", "rate_limited"].includes(lr)) {
    alert.className = "alert err on"; alert.textContent = T.lastRun(lr) + (f.last_run.message ? ` · ${f.last_run.message}` : "");
  } else if (f.stale && h != null) {
    alert.className = "alert on"; alert.textContent = T.stale(h);
  } else alert.className = "alert";

  const color = css(`--${r.label === "unknown" ? "faint" : r.label}`);

  $("basis").textContent = s.recovery_date && s.recovery_date !== s.date ? T.basis(dm(s.recovery_date)) : "";

  const chips = [];
  const lo = t.hrv_baseline_low, hi = t.hrv_baseline_high, hrv = t.hrv_last_night;
  if (hrv != null && lo != null) chips.push(hrv < lo ? ["neg", T.hrvLow] : hrv > hi ? ["pos", T.hrvHigh] : ["pos", T.hrvOk]);
  if (t.sleep_seconds != null && t.sleep_seconds < 6 * 3600) chips.push(["neg", T.shortSleep]);
  else if (t.sleep_score >= 85) chips.push(["pos", T.greatSleep]);
  if (t.resting_hr != null && b.resting_hr != null) {
    const d = t.resting_hr - b.resting_hr;
    if (d >= 3) chips.push(["neg", T.rhrHigh]); else if (d <= -3) chips.push(["pos", T.rhrLow]);
  }
  const bb = t.bb_wake ?? t.bb_high;
  if (bb != null) { if (bb < 40) chips.push(["neg", T.bbLow]); else if (bb >= 85) chips.push(["pos", T.bbHigh]); }
  if (t.acwr_status === "HIGH") chips.push(["neg", T.rampUp]);
  $("chips").innerHTML = chips.slice(0, 3).map(([c, txt]) => `<span class="chip ${c}">${txt}</span>`).join("");

  ring($("m-sleep"), t.sleep_score, css("--sleep"), 10);
  $("m-sleep-i").innerHTML = `<span class="num">${hm(t.sleep_seconds)}</span>`;
  ring($("m-bb"), bb, css("--bb"), 10);
  $("m-bb-i").textContent = T.atWake;
  ring($("m-ready"), t.readiness_score, css("--ready"), 10);
  $("m-ready-i").textContent = t.readiness_level ? (T.levels[t.readiness_level] || t.readiness_level.toLowerCase()) : "";

  // sleep card
  $("s-total").textContent = hm(t.sleep_seconds);
  $("s-score").textContent = t.sleep_score != null ? `${T.score} ${t.sleep_score}` : "";
  $("s-times").innerHTML = t.sleep_start ? `<span class="num">${clock(t.sleep_start)} → ${clock(t.sleep_end)}</span>` : "";
  const st = [t.deep_seconds, t.light_seconds, t.rem_seconds, t.awake_seconds];
  raf2(() => [...$("s-stages").children].forEach((d, i) => d.style.flexGrow = st[i] || 0));
  const names = [[T.deep, "--deep"], [T.light, "--light"], [T.rem, "--rem"], [T.awake, "--awake"]];
  $("s-legend").innerHTML = names.map(([nm, c], i) => `<div><span style="--c:var(${c})">${nm}</span><b class="num">${hm(st[i])}</b></div>`).join("");

  const rows = [];

    const min = Math.min(lo ?? hrv, hrv) * 0.8, max = Math.max(hi ?? hrv, hrv) * 1.15, pos = x => ((x - min) / (max - min)) * 100;
    const dotC = lo != null && hrv < lo ? css("--fair") : css("--good");

      <div class="meter">${lo != null ? `<div class="band" style="left:${pos(lo)}%;width:${pos(hi) - pos(lo)}%"></div>` : ""}
      <div class="dot" style="left:${pos(hrv)}%;background:${dotC}"></div></div></div>`);
  }
  if (t.resting_hr != null) rows.push(`<div class="vital"><div class="k">${T.rhr}<small>${T.rhrSub(b.resting_hr == null ? null : b.resting_hr.toFixed(0))}</small></div>
      <div class="v num">${t.resting_hr} <small>bpm</small></div></div>`);
  if (y.stress_avg != null) rows.push(`<div class="vital"><div class="k">${T.stress}<small>${T.stressSub} · ${T.stressLv(y.stress_avg)}</small></div>
      <div class="v num">${y.stress_avg}</div>
      <div class="meter"><div class="fill" data-w="${y.stress_avg}" style="background:var(--ready)"></div></div></div>`);
  if (y.steps != null) rows.push(`<div class="vital"><div class="k">${T.steps}<small>${T.stepsSub(n0(y.step_goal))}</small></div>
      <div class="v num">${n0(y.steps)}</div>
      <div class="meter"><div class="fill" data-w="${y.step_goal ? Math.min(100, 100 * y.steps / y.step_goal) : 0}" style="background:var(--good)"></div></div></div>`);
  $("vitals").innerHTML = `<h3>${T.body}</h3>` + rows.join("");
  raf2(() => document.querySelectorAll("#vitals .fill").forEach(el => el.style.width = el.dataset.w + "%"));

  renderFitness(s.fitness || {});

  const acts = s.activities_7d.slice().reverse().slice(0, 3);
  $("acts-preview").innerHTML = acts.length ? acts.map(actRow).join("") : `<div class="empty">${T.noActs}</div>`;

  $("foot").innerHTML = [
    f.device ? esc(f.device) : "",
    f.last_watch_sync ? `${T.watchAgo(h)}` : T.noSync,
    lr ? T.lastRun(lr) : "",
  ].filter(Boolean).join("<br>");

  loadWeek();
}

function renderFitness(fit) {
  const rows = [];
  if (fit.fitness_age != null) {
    const a = fit.chronological_age, fa = fit.fitness_age, best = fit.achievable_fitness_age;
    let meter = "";
    if (a != null && best != null) {
      const lo = Math.min(best, fa) - 2, hi = Math.max(a, fa) + 2, pos = x => ((x - lo) / (hi - lo)) * 100;
      meter = `<div class="meter"><div class="band" style="left:${pos(best)}%;width:${pos(a) - pos(best)}%"></div>
        <div class="tick" style="left:${pos(a)}%"></div><div class="dot" style="left:${pos(fa)}%;background:var(--good)"></div></div>
        <div class="k" style="grid-column:1/-1"><small class="num">${T.fitScale(Math.round(best), a)}</small></div>`;
    }
    rows.push(`<div class="vital"><div class="k">${T.fitAge}<small>${a != null ? T.fitSub(a, a - fa) : ""}</small></div>
      <div class="v num">${fa.toFixed(1)}</div>${meter}</div>`);
  }
  if (fit.spo2_sleep_avg != null) {
    const pos = x => Math.max(0, Math.min(100, ((x - 80) / 20) * 100));
    rows.push(`<div class="vital"><div class="k">${T.spo2}<small>${T.spo2Sub(fit.spo2_sleep_low ?? "–")}</small></div>
      <div class="v num">${Math.round(fit.spo2_sleep_avg)}<small>%</small></div>
      <div class="meter"><div class="fill" data-w="${pos(fit.spo2_sleep_avg)}" style="background:var(--bb)"></div>
      ${fit.spo2_sleep_low != null ? `<div class="tick" style="left:${pos(fit.spo2_sleep_low)}%"></div>` : ""}</div></div>`);
  }
  const vo2 = fit.vo2max ?? fit.vo2max_estimate;
  if (vo2 != null) {
    rows.push(`<div class="vital"><div class="k">${T.vo2}<small>${fit.vo2max != null ? T.vo2Garmin : T.vo2Est}</small></div>
      <div class="v num">${fit.vo2max != null ? "" : "≈"}${vo2.toFixed(1)}</div></div>`);
  }
  $("fitness").style.display = rows.length ? "" : "none";
  $("fitness").innerHTML = `<h3>${T.fitTitle}</h3>` + rows.join("");
  raf2(() => document.querySelectorAll("#fitness .fill").forEach(el => el.style.width = el.dataset.w + "%"));
}

const runStart = st => st.last_run && st.last_run.started_at;
$("syncbtn").title = T.syncTip;
async function waitForSync(before) {
  $("syncbtn").classList.add("spin");
  let st;
  for (let i = 0; i < 200; i++) {
    await pause(3000);
    st = await (await fetch("/api/status")).json();
    if (!st.running && (before === undefined || runStart(st) !== before)) break;
  }
  $("syncbtn").classList.remove("spin");
  const status = st.last_run && st.last_run.status;
  toast(status === "ok" ? T.syncDone : T.lastRun(status || "?"));
  refreshAll();
}
async function sync() {
  document.body.classList.remove("menu");
  if ($("syncbtn").classList.contains("spin")) return;
  const before = runStart(await (await fetch("/api/status")).json());
  const r = await (await fetch("/api/sync", { method: "POST", headers: { "X-Garmin-Health": "1" } })).json();
  if (r.started) return waitForSync(before);
  if (r.reason === "running") { toast(T.syncRunning); return waitForSync(); }
  toast(r.reason === "recent" ? T.syncRecent(Math.ceil(r.retry_after / 60))
    : r.reason === "blocked" ? T.syncBlocked : r.reason);
}
$("syncbtn").addEventListener("click", sync);
$("navsync").addEventListener("click", sync);

if (location.hash && location.hash !== "#today") { loaded.today = true; loadToday(); }
show();
</script>
</body>
</html>
