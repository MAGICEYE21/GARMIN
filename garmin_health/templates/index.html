<!doctype html>
<html lang="{{ lang }}" dir="{{ 'rtl' if lang == 'he' else 'ltr' }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Garmin Health</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><circle cx='8' cy='8' r='7' fill='%232f7d6d'/></svg>">
<script src="{{ url_for('static', filename='chart.umd.min.js') }}"></script>
<style>
  :root {
    --bg: #f6f7f8; --card: #fff; --text: #1d2126; --muted: #6b7280; --line: #e5e7eb;
    --good: #2f7d6d; --fair: #b7791f; --low: #c0392b;
    --c1: #2f6db5; --c2: #7aa6db; --c3: #8e6ccf; --c4: #d4d8de; --c5: #2f7d6d; --c6: #e07b39;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111418; --card: #1a1e24; --text: #e8eaed; --muted: #9aa0a6; --line: #2b3038;
      --c4: #4a5059;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  }
  main { max-width: 1100px; margin: 0 auto; padding: 16px; }
  header { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  h1 { font-size: 20px; margin: 0; font-weight: 650; }
  h2 { font-size: 14px; margin: 0 0 8px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .03em; }
  .controls { display: flex; gap: 8px; align-items: center; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg button {
    border: 0; background: var(--card); color: var(--text); padding: 6px 12px; font: inherit; cursor: pointer;
  }
  .seg button.on { background: var(--text); color: var(--bg); }
  .syncbtn {
    border: 1px solid var(--line); background: var(--card); color: var(--text); border-radius: 8px;
    padding: 6px 12px; font: inherit; cursor: pointer;
  }
  .syncbtn:disabled { color: var(--muted); cursor: default; }
  #syncmsg { color: var(--muted); font-size: 13px; }
  a.lang { color: var(--muted); text-decoration: none; font-size: 13px; }
  .banner { padding: 10px 12px; border-radius: 8px; margin-bottom: 12px; font-size: 14px; display: none; }
  .banner.stale { display: block; background: #fdf1e2; color: #7a4a0c; }
  .banner.err { display: block; background: #fbe4e1; color: #7f1d14; }
  @media (prefers-color-scheme: dark) {
    .banner.stale { background: #3a2a12; color: #f3c98b; }
    .banner.err { background: #3d1814; color: #f5aaa0; }
  }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
  .recovery { display: grid; grid-template-columns: auto 1fr; gap: 18px; align-items: center; margin-bottom: 14px; }
  .score { width: 104px; height: 104px; border-radius: 50%; display: grid; place-items: center; border: 8px solid var(--line); }
  .score b { font-size: 30px; display: block; text-align: center; line-height: 1; }
  .score span { font-size: 12px; color: var(--muted); display: block; text-align: center; margin-top: 4px; }
  .score.good { border-color: var(--good); } .score.fair { border-color: var(--fair); } .score.low { border-color: var(--low); }
  .notes { margin: 6px 0 0; padding: 0; list-style: none; color: var(--muted); font-size: 14px; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 10px; }
  .tile small { color: var(--muted); display: block; font-size: 12px; }
  .tile b { font-size: 18px; font-weight: 600; display: inline-block; direction: ltr; unicode-bidi: isolate; }
  .tile i { font-style: normal; color: var(--muted); font-size: 12px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .chart { position: relative; height: 230px; }
  .acts { width: 100%; border-collapse: collapse; font-size: 14px; }
  .acts td { padding: 6px 4px; border-top: 1px solid var(--line); }
  .acts td.n { text-align: end; direction: ltr; unicode-bidi: isolate; white-space: nowrap; font-variant-numeric: tabular-nums; color: var(--muted); }
  footer { color: var(--muted); font-size: 12px; margin: 16px 0; display: flex; flex-wrap: wrap; gap: 12px; }
  footer a { color: var(--muted); }
  @media (max-width: 760px) {
    .grid { grid-template-columns: 1fr; }
    .recovery { grid-template-columns: 1fr; }
    .chart { height: 200px; }
  }
</style>
</head>
<body>
<main>
  <header>
    <h1 data-t="title">Garmin Health</h1>
    <div class="controls">
      <span id="syncmsg"></span>
      <button class="syncbtn" id="syncbtn" data-t="syncNow">Sync now</button>
      <div class="seg" id="range">
        <button data-days="7">7d</button><button data-days="30" class="on">30d</button><button data-days="90">90d</button>
      </div>
      <a class="lang" href="?lang={{ 'en' if lang == 'he' else 'he' }}">{{ 'English' if lang == 'he' else 'עברית' }}</a>
    </div>
  </header>

  <div id="banner" class="banner"></div>

  <section class="card recovery">
    <div id="score" class="score"><div><b id="score-n">–</b><span id="score-l"></span></div></div>
    <div>
      <h2><span data-t="recovery">Recovery</span> <span id="rec-date" style="text-transform:none"></span></h2>
      <div class="tiles" id="tiles"></div>
      <ul class="notes" id="notes"></ul>
    </div>
  </section>

  <div class="grid">
    <section class="card"><h2 data-t="sleep">Sleep</h2><div class="chart"><canvas id="c-sleep"></canvas></div></section>
    <section class="card"><h2 data-t="hrv">HRV</h2><div class="chart"><canvas id="c-hrv"></canvas></div></section>
    <section class="card"><h2 data-t="rhr">Resting heart rate</h2><div class="chart"><canvas id="c-rhr"></canvas></div></section>
    <section class="card"><h2 data-t="bb">Body Battery</h2><div class="chart"><canvas id="c-bb"></canvas></div></section>
    <section class="card"><h2 data-t="load">Training load</h2><div class="chart"><canvas id="c-load"></canvas></div></section>
    <section class="card"><h2 data-t="acts">Activities (7 days)</h2><table class="acts" id="acts"></table></section>
  </div>

  <footer>
    <span id="sync"></span>
    <a href="/api/summary">/api/summary</a>
    <a href="/api/summary.txt">/api/summary.txt</a>
  </footer>
</main>

<script>
const LANG = "{{ lang }}";
const T = {
  en: {
    title: "Garmin Health", recovery: "Recovery", sleep: "Sleep", hrv: "HRV", rhr: "Resting heart rate",
    bb: "Body Battery", load: "Training load", acts: "Activities (7 days)",
    good: "good", fair: "fair", low: "low", unknown: "no data",
    deep: "Deep", light: "Light", rem: "REM", awake: "Awake", hours: "hours", score: "Score",
    lastNight: "Last night", weekly: "7-day avg", baseline: "Baseline", bpm: "bpm",
    range: "Range", atWake: "At wake", daily: "Activity load", acute: "Acute", chronic: "Chronic",
    t_sleep: "Sleep", t_hrv: "HRV", t_rhr: "Resting HR", t_bb: "Body Battery", t_ready: "Readiness",
    t_status: "Training status", t_vo2: "VO2 max", t_steps: "Steps yesterday",
    stale: h => `Data is stale: the watch last synced ${h} hours ago.`,
    staleUnknown: "No watch sync recorded yet. Run a sync first.",
    synced: (t, h) => `Watch synced ${t} (${h}h ago)`, lastRun: "Last run", noActs: "No activities.",
    fromDate: d => `(${d})`,
    syncNow: "Sync now", syncing: "Syncing…",
    syncTip: "Pulls from Garmin Connect whatever the watch has already uploaded",
    syncDone: "Done", syncFailed: s => `Sync ended: ${s}`,
    syncRunning: "A sync is already running", syncRecent: m => `Synced recently; try again in ${m} min`,
    syncBlocked: "Sync paused to protect the account",
  },
  he: {
    title: "בריאות Garmin", recovery: "התאוששות", sleep: "שינה", hrv: "HRV", rhr: "דופק במנוחה",
    bb: "Body Battery", load: "עומס אימונים", acts: "פעילויות (7 ימים)",
    good: "טובה", fair: "בינונית", low: "נמוכה", unknown: "אין נתונים",
    deep: "עמוקה", light: "קלה", rem: "REM", awake: "ער", hours: "שעות", score: "ציון",
    lastNight: "לילה אחרון", weekly: "ממוצע 7 ימים", baseline: "טווח בסיס", bpm: "פעימות",
    range: "טווח", atWake: "בהתעוררות", daily: "עומס פעילות", acute: "אקוטי", chronic: "כרוני",
    t_sleep: "שינה", t_hrv: "HRV", t_rhr: "דופק מנוחה", t_bb: "Body Battery", t_ready: "מוכנות",
    t_status: "סטטוס אימון", t_vo2: "VO2 max", t_steps: "צעדים אתמול",
    stale: h => `הנתונים ישנים: השעון סונכרן לפני ${h} שעות.`,
    staleUnknown: "עדיין לא נרשם סנכרון. הריצו סנכרון.",
    synced: (t, h) => `סונכרן ${t} (לפני ${h} ש׳)`, lastRun: "ריצה אחרונה", noActs: "אין פעילויות.",
    fromDate: d => `(${d})`,
    syncNow: "סנכרן עכשיו", syncing: "מסנכרן…",
    syncTip: "מושך מ-Garmin Connect את מה שהשעון כבר העלה",
    syncDone: "עודכן", syncFailed: s => `הסנכרון הסתיים: ${s}`,
    syncRunning: "סנכרון כבר רץ", syncRecent: m => `סונכרן לא מזמן; נסו שוב בעוד ${m} דק׳`,
    syncBlocked: "הסנכרון מושהה כדי להגן על החשבון",
  },
}[LANG];
document.querySelectorAll("[data-t]").forEach(el => { if (T[el.dataset.t]) el.textContent = T[el.dataset.t]; });

const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
Chart.defaults.color = css("--muted");
Chart.defaults.borderColor = css("--line");
Chart.defaults.font.family = getComputedStyle(document.body).fontFamily;
Chart.defaults.plugins.legend.labels.boxWidth = 10;
Chart.defaults.maintainAspectRatio = false;
Chart.defaults.spanGaps = true;
Chart.defaults.interaction = { mode: "index", intersect: false };

const charts = {};
function draw(id, config) {
  if (charts[id]) charts[id].destroy();
  charts[id] = new Chart(document.getElementById(id), config);
}
const short = d => d.slice(5).replace("-", "/");
// Lines get a lower `order` so they draw on top of bars.
const line = (label, data, color, extra = {}) =>
  ({ type: "line", label, data, borderColor: color, backgroundColor: color, pointRadius: 2, borderWidth: 2, tension: .3, order: 0, ...extra });
const bar = (label, data, color, extra = {}) => ({ type: "bar", label, data, backgroundColor: color, borderRadius: 2, order: 1, ...extra });

async function loadTrends(days) {
  const d = await (await fetch(`/api/trends?days=${days}`)).json();
  const labels = d.dates.map(short);
  const stacked = { x: { stacked: true }, y: { stacked: true, title: { display: true, text: T.hours } } };

  draw("c-sleep", { data: { labels, datasets: [
      bar(T.deep, d.sleep.deep, css("--c1"), { stack: "s" }),
      bar(T.light, d.sleep.light, css("--c2"), { stack: "s" }),
      bar(T.rem, d.sleep.rem, css("--c3"), { stack: "s" }),
      bar(T.awake, d.sleep.awake, css("--c4"), { stack: "s" }),
      line(T.score, d.sleep.score, css("--c6"), { yAxisID: "y2" }),
    ] },
    options: { scales: { ...stacked, y2: { position: "right", min: 0, max: 100, grid: { display: false } } } } });

  draw("c-hrv", { data: { labels, datasets: [
      line(T.lastNight, d.hrv.last_night, css("--c1")),
      line(T.weekly, d.hrv.weekly_avg, css("--c3"), { borderDash: [4, 3], pointRadius: 0 }),
      line(T.baseline, d.hrv.baseline_low, "transparent", { pointRadius: 0, backgroundColor: css("--c4") + "88", fill: false }),
      line(T.baseline, d.hrv.baseline_high, "transparent", { pointRadius: 0, backgroundColor: css("--c4") + "88", fill: "-1" }),
    ] },
    options: { plugins: { legend: { labels: { filter: (it, cd) => it.datasetIndex !== 2 } } }, scales: { y: { title: { display: true, text: "ms" } } } } });

  draw("c-rhr", { data: { labels, datasets: [line(T.rhr, d.resting_hr, css("--low"))] },
    options: { plugins: { legend: { display: false } }, scales: { y: { title: { display: true, text: T.bpm } } } } });

  const range = d.dates.map((_, i) => d.body_battery.low[i] == null || d.body_battery.high[i] == null ? null : [d.body_battery.low[i], d.body_battery.high[i]]);
  draw("c-bb", { data: { labels, datasets: [
      bar(T.range, range, css("--c2")),
      line(T.atWake, d.body_battery.wake, css("--good")),
    ] }, options: { scales: { y: { min: 0, max: 100 } } } });

  draw("c-load", { data: { labels, datasets: [
      bar(T.daily, d.training_load.daily, css("--c2")),
      line(T.acute, d.training_load.acute, css("--c6"), { pointRadius: 0 }),
      line(T.chronic, d.training_load.chronic, css("--c1"), { pointRadius: 0 }),
    ] } });
}

const fmtH = s => s == null ? "–" : `${Math.floor(s / 3600)}:${String(Math.floor(s % 3600 / 60)).padStart(2, "0")}`;
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const pretty = s => s ? s.replace(/_/g, " ").toLowerCase() : "–";
const v = (x, suffix = "") => x == null ? "–" : `${Math.round(x).toLocaleString()}${suffix}`;

async function loadSummary() {
  const s = await (await fetch("/api/summary")).json();
  const t = s.today || {}, r = s.recovery, f = s.freshness, b = s.baseline_30d;

  const banner = document.getElementById("banner");
  if (f.last_run && ["login_needed", "error", "rate_limited"].includes(f.last_run.status)) {
    banner.className = "banner err"; banner.textContent = `${T.lastRun}: ${f.last_run.status}. ${f.last_run.message || ""}`;
  } else if (f.stale) {
    banner.className = "banner stale";
    banner.textContent = f.hours_since_sync == null ? T.staleUnknown : T.stale(Math.round(f.hours_since_sync));
  }
  document.getElementById("sync").textContent = f.last_watch_sync
    ? T.synced(f.last_watch_sync.replace("T", " ").slice(0, 16), Math.round(f.hours_since_sync)) : "";

  const sc = document.getElementById("score");
  sc.className = "score " + r.label;
  document.getElementById("score-n").textContent = r.score ?? "–";
  document.getElementById("score-l").textContent = T[r.label] || r.label;
  if (s.recovery_date) document.getElementById("rec-date").textContent = T.fromDate(s.recovery_date);

  const delta = (x, base) => x == null || base == null ? "" : ` <i>(${x - base >= 0 ? "+" : ""}${Math.round(x - base)})</i>`;
  const tiles = [
    [T.t_sleep, `${fmtH(t.sleep_seconds)}${t.sleep_score != null ? ` <i>· ${t.sleep_score}</i>` : ""}`],
    [T.t_hrv, `${v(t.hrv_last_night, " ms")}${t.hrv_status ? ` <i>· ${pretty(t.hrv_status)}</i>` : ""}`],
    [T.t_rhr, v(t.resting_hr) + delta(t.resting_hr, b.resting_hr)],
    [T.t_bb, v(t.bb_wake ?? t.bb_high)],
    [T.t_ready, `${v(t.readiness_score)}${t.readiness_level ? ` <i>· ${pretty(t.readiness_level)}</i>` : ""}`],
    [T.t_status, pretty(t.training_status)],
    [T.t_vo2, t.vo2max_running == null ? "–" : t.vo2max_running.toFixed(1)],
    [T.t_steps, v(s.yesterday_activity.steps)],
  ];
  document.getElementById("tiles").innerHTML = tiles.map(([k, val]) => `<div class="tile"><small>${k}</small><b>${val}</b></div>`).join("");
  document.getElementById("notes").innerHTML = r.notes.map(n => `<li>• ${esc(n)}</li>`).join("");

  const acts = s.activities_7d.slice().reverse();
  document.getElementById("acts").innerHTML = acts.length ? acts.map(a => `<tr>
      <td>${a.date.slice(5)}</td><td>${esc(a.name || pretty(a.type))}</td>
      <td class="n">${a.distance_m ? (a.distance_m / 1000).toFixed(1) + " km" : ""}</td>
      <td class="n">${fmtH(a.duration_s)}</td>
      <td class="n">${a.training_load ? Math.round(a.training_load) : ""}</td></tr>`).join("")
    : `<tr><td>${T.noActs}</td></tr>`;
}

let days = 30;
try { days = Number(localStorage.getItem("days")) || 30; } catch (e) {}
function setRange(n) {
  days = n;
  document.querySelectorAll("#range button").forEach(b => b.classList.toggle("on", Number(b.dataset.days) === n));
  try { localStorage.setItem("days", n); } catch (e) {}
  loadTrends(n);
}
document.querySelectorAll("#range button").forEach(b => b.addEventListener("click", () => setRange(Number(b.dataset.days))));
setRange([7, 30, 90].includes(days) ? days : 30);
loadSummary();

const syncBtn = document.getElementById("syncbtn"), syncMsg = document.getElementById("syncmsg");
syncBtn.title = T.syncTip;
const pause = ms => new Promise(r => setTimeout(r, ms));
const runStart = st => st.last_run && st.last_run.started_at;
async function waitForSync(before) {
  syncBtn.disabled = true; syncBtn.textContent = T.syncing; syncMsg.textContent = "";
  let st;
  // Wait for a run newer than the one before the click to start and finish.
  for (let i = 0; i < 200; i++) {
    await pause(3000);
    st = await (await fetch("/api/status")).json();
    if (!st.running && (before === undefined || runStart(st) !== before)) break;
  }
  syncBtn.disabled = false; syncBtn.textContent = T.syncNow;
  const status = st.last_run && st.last_run.status;
  syncMsg.textContent = status === "ok" ? T.syncDone : T.syncFailed(status || "?");
  document.getElementById("banner").className = "banner";
  loadSummary(); loadTrends(days);
}
syncBtn.addEventListener("click", async () => {
  syncBtn.disabled = true;
  const before = runStart(await (await fetch("/api/status")).json());
  const r = await (await fetch("/api/sync", { method: "POST", headers: { "X-Garmin-Health": "1" } })).json();
  if (r.started) return waitForSync(before);
  if (r.reason === "running") return waitForSync();
  syncBtn.disabled = false;
  syncMsg.textContent = r.reason === "recent" ? T.syncRecent(Math.ceil(r.retry_after / 60))
    : r.reason === "blocked" ? `${T.syncBlocked}: ${r.message}` : r.reason;
});
</script>
</body>
</html>
