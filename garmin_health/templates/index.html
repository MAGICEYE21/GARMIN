<!doctype html>
<html lang="{{ lang }}" dir="{{ 'rtl' if lang == 'he' else 'ltr' }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Health">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="{{ url_for('static', filename='icon-180.png') }}">
<title>Garmin Health</title>
<link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}?v={{ version }}">
<script src="{{ url_for('static', filename='chart.umd.min.js') }}"></script>
</head>
<body>
<div class="topbar" id="topbar"><b id="topbar-title"></b></div>
<button class="glassbtn" id="syncbtn" aria-label="sync">
  <svg class="i" viewBox="0 0 24 24"><path d="M20 11a8 8 0 0 0-14.3-4.9L4 8M4 4v4h4M4 13a8 8 0 0 0 14.3 4.9L20 16M20 20v-4h-4"/></svg>
</button>

<main>
  <div id="alert" class="alert"></div>
  <section class="page" id="p-today"></section>
  <section class="page" id="p-sleep"></section>
  <section class="page" id="p-activities"></section>
  <section class="page" id="p-trends"></section>
</main>

<div class="sheet" id="sheet"></div>

<nav class="tabbar" id="tabbar">
  <span class="pill" id="pill"></span>
  <a href="#today" data-tab="today"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5a8.5 8.5 0 0 1 8.5 8.5"/></svg><span data-t="today"></span></a>
  <a href="#sleep" data-tab="sleep"><svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg><span data-t="sleep"></span></a>
  <a href="#activities" data-tab="activities"><svg viewBox="0 0 24 24"><path d="M3 12h4l3-7 4 14 3-7h4"/></svg><span data-t="acts"></span></a>
  <a href="#trends" data-tab="trends"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span data-t="trends"></span></a>
</nav>
<div class="toast" id="toast"></div>

<script>const LANG = "{{ lang }}", OTHER_LANG_URL = "?lang={{ 'he' if lang == 'en' else 'en' }}";</script>
<script src="{{ url_for('static', filename='app.js') }}?v={{ version }}"></script>
</body>
</html>
